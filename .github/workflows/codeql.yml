name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Weekly scan catches new CodeQL query/vulnerability signatures even when
    # nothing in the repo has changed.
    - cron: '19 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # "java-kotlin" is the correct CodeQL language id for a Kotlin codebase —
          # there is no standalone "kotlin" id. build-mode must be autobuild (not
          # "none") whenever Kotlin sources are present, or CodeQL silently skips
          # analyzing them and only covers any incidental Java.
          - language: java-kotlin
            build-mode: autobuild

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
 