name: Dependency Policy Check

on: [push, pull_request]

jobs:
  dependency-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Check for banned packages
        run: |
          BANNED_PACKAGES=(
            "com.google.firebase"
            "com.google.android.gms:play-services-analytics"
            "com.crashlytics"
          )
          
          for pkg in "${BANNED_PACKAGES[@]}"; do
            if grep -r "$pkg" app/build.gradle.kts gradle/; then
              echo "❌ BLOCKED: Found $pkg"
              exit 1
            fi
          done
          echo "✅ No banned packages found"
      
      - name: Check gradle dependencies
        run: ./gradlew dependencies --no-daemon > deps.txt && cat deps.txt
  