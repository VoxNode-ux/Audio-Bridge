name: Secret Scanning

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # v3, not v2: v2 is built on Node 20, which GitHub-hosted runners drop
      # entirely on 2026-09-16 — v3 (Node 24) is the current non-deprecated release.
      # No GITLEAKS_LICENSE needed for a personal-account repo, only for orgs.
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}