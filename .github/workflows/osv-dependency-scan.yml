name: OSV-Scanner

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  # Required to write SARIF results back to GitHub's Security > Code Scanning alerts
  security-events: write
  # Required to let the reusable workflow read the repository content
  contents: read

jobs:
  scan-repository:
    # Leverages the official Google v2 full scan reusable workflow at the job level
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2
 